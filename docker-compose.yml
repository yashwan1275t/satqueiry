services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: satquery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: satquery_secret_password
      POSTGRES_DB: satquery_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satquery -d satquery_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: satquery-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://satquery:satquery_secret_password@postgres:5432/satquery_db
      USE_MOCK_AI: "true"
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: satquery-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  storage_data:
